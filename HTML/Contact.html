<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تواصل معنا</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #f5f7fa;
    }

    .hero {
      background: linear-gradient(135deg, #198754, #157347);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .card-custom {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
    }

    .btn-success {
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
    }

    .whatsapp-box {
      background: #25D366;
      color: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .whatsapp-box a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="../index.html">Wedding Finder</a>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <h1>تواصل معنا</h1>
  <p>نحن هنا لمساعدتك في أي وقت</p>
</section>

<!-- Content -->
<div class="container my-5">

  <div class="row g-4 justify-content-center">

    <!-- Contact Form -->
    <div class="col-md-6">
      <div class="card card-custom p-4">
        <h4 class="mb-4 text-center">أرسل رسالة</h4>

        <form>

          <div class="mb-3">
            <label class="form-label">الاسم</label>
            <input type="text" class="form-control" placeholder="اكتب اسمك">
          </div>

          <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" placeholder="example@email.com">
          </div>

          <div class="mb-3">
            <label class="form-label">رسالتك</label>
            <textarea class="form-control" rows="4" placeholder="اكتب رسالتك هنا"></textarea>
          </div>

          <button class="btn btn-success w-100">إرسال</button>

        </form>
      </div>
    </div>

    <!-- WhatsApp -->
    <div class="col-md-4">
      <div class="whatsapp-box">
        <h5>تواصل عبر واتساب</h5>
        <p>اضغط للتحدث معنا مباشرة</p>

        <a href="https://wa.me/201000000000?text=مرحباً،%20أرغب%20في%20الاستفسار">
          📱 01000000000
        </a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
