<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>انضم كشريك</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #f5f7fa;
    }

    .hero {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .form-card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
    }

    .btn-primary {
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
    }

    .features {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="./new.html">Wedding Finder</a>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <h1>انضم كشريك</h1>
  <p>زود حجوزاتك واعرض قاعتك لآلاف العملاء</p>
</section>

<!-- Form Section -->
<div class="container my-5">

  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-6">
      <div class="card form-card p-4">

        <h4 class="mb-4 text-center">تسجيل قاعتك</h4>

        <form>

          <div class="mb-3">
            <label class="form-label">اسم القاعة</label>
            <input type="text" class="form-control" placeholder="مثال: قاعة النور">
          </div>

          <div class="mb-3">
            <label class="form-label">الموقع</label>
            <input type="text" class="form-control" placeholder="المدينة / المنطقة">
          </div>

          <div class="mb-3">
            <label class="form-label">رقم الهاتف</label>
            <input type="text" class="form-control" placeholder="01XXXXXXXXX">
          </div>

          <button class="btn btn-primary w-100">تسجيل</button>

        </form>

      </div>
    </div>

    <!-- Benefits -->
    <div class="col-md-4">
      <div class="features">
        <h5>لماذا تنضم؟</h5>
        <ul>
          <li>زيادة عدد الحجوزات</li>
          <li>الوصول لعملاء جدد</li>
          <li>عرض قاعتك بشكل احترافي</li>
          <li>تواصل مباشر عبر واتساب</li>
        </ul>
      </div>
    </div>

  </div>

</div>

</body>
</html>
